server:
  port: 0

spring:
  application:
    name: logosflow-content-repository

eureka:
  instance:
    instance-id: ${spring.application.name}:${CONTENT_REPOSITORY_INSTANCE_ID:${random.value}}
  serviceUrl:
    defaultZone: ${EUREKA_URI:http://${eureka.serviceHost}:${eureka.servicePort:8761}/eureka}
  # Custom properties
  serviceHost: ${EUREKA_HOST:localhost}
  servicePort: ${EUREKA_PORT:8761}

repositories:
  content:
    databases:
      minio:
        # Custom properties
        schema: ${MINIO_SCHEMA:http}
        host: ${MINIO_HOST:localhost}
        port: ${MINIO_PORT:9000}
        #
        url: ${MINIO_URL:${repositories.content.databases.minio.schema}://${repositories.content.databases.minio.host}:$repositories.content.databases.minio.port}
        access-key: ${MINIO_ACCESS_KEY:minio}
        secret-key: ${MINIO_SECRET_KEY:logosDevPwd}
        bucket: ${MINIO_BUCKET:content}
        region: ${MINIO_REGION:us-east-1}
        path: ${MINIO_PATH:content}
