name: mcpo-ai-stack

networks:
  mcpo_net:
    driver: bridge
    name: mcpo_net

volumes:
  mcpo_config:
    name: mcpo_config

services:
  traefik:
    image: "traefik:v3.1.0"
    container_name: traefik_proxy
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8081"
      - "--entrypoints.websecure.address=:8443"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--log.level=INFO"
    ports:
      - "8081:8081"
      - "8443:8443" 
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./certs:/etc/traefik/certs:ro"
      - "./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro"
    networks:
      - mcpo_net
    restart: unless-stopped

# Ollama service for running Mistral models (optimized for 16GB RAM)
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_server
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cody_net
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_ORIGINS=*
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MAX_LOADED_MODELS=1  # Only keep 1 model loaded at a time
      - OLLAMA_NUM_PARALLEL=1       # Limit parallel requests
      - OLLAMA_MAX_QUEUE=512        # Limit request queue
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama.rule=Host(`ollama.local.dev`)"
      - "traefik.http.routers.ollama.entrypoints=websecure"
      - "traefik.http.routers.ollama.tls=true"
      - "traefik.http.services.ollama.loadbalancer.server.port=11434"
    deploy:
      resources:
        limits:
          memory: 12G  # Reserve 4GB for system
        reservations:
          memory: 8G

  # OpenWebUI for model interaction
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: openwebui_server
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - openwebui-data:/app/backend/data
    networks:
      - cody_net
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=devPwd
      - WEBUI_AUTH=False  # Set to True for authentication
    depends_on:
      - ollama
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`ui.local.dev`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls=true"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

  # Model downloader service (downloads smaller, optimized models)
  model-downloader:
    image: ollama/ollama:latest
    container_name: model_downloader
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - cody_net
    depends_on:
      - ollama
    entrypoint: /bin/sh
    command: |
      -c "
      echo 'Waiting for Ollama to be ready...'
      sleep 30
      echo 'Downloading optimized models for 16GB RAM...'
      ollama pull qwen2.5-coder:7b-instruct-q4_K_M
      ollama pull deepseek/deepseek-r1-0528-qwen3-8b:q4_K_M
      ollama pull qwen/qwen3-4b-2507:q4_K_M
      ollama pull qwen/qwen3-8b:q4_K_M
      ollama pull mistralai/mistral-7b-instruct-v0.3:q4_K_M
      echo 'Models downloaded successfully'
      echo 'Available models:'
      ollama list
      "
    restart: "no"