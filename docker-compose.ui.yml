# docker-compose.ui.yml

name: logosflow-ui-stack

networks:
  logosflow_net:
    # This network is defined in the docker-compose.llm.yml file
    external: true

volumes:
  openwebui-data:
    name: logosflow_openwebui_data

services:
  traefik:
    image: traefik:v3.1.0
    container_name: traefik_proxy
    command:
      - "--api.insecure=true"                 # Enable dashboard (dev only)
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8081"
      - "--log.level=INFO"
    ports:
      - "8081:8081" # Main entrypoint for services
      - "8080:8080" # Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - logosflow_net
    restart: unless-stopped

  openwebui:
    image: ghcr.io/open-webui/open-webui:0.2.14
    container_name: openwebui_server
    restart: unless-stopped
    volumes:
      - openwebui-data:/app/backend/data
    ports:
      - "${HTTP_PORT:-3000}:8080"
    environment:
      # Connect to the LiteLLM proxy instead of directly to Ollama
      - OPENAI_API_BASE_URL=http://litellm_proxy:4000
      # Use a dummy key as LiteLLM will handle the actual model routing
      - OPENAI_API_KEY=sk-logosflow-local
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-logosflow-secret-key}
      - ENABLE_RAG_WEB_SEARCH=true
    depends_on:
      - traefik
    networks:
      - logosflow_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`localhost`) || Host(`ui.logosflow.local`)"
      - "traefik.http.routers.openwebui.entrypoints=web"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
